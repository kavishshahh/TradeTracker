# Separate process, shared backend environment and existing Firestore project.
services:
  - type: worker
    name: tradebud-paper-algos
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r algos/zen_credit/requirements-paper.txt
    startCommand: python -u algos/zen_credit/paper_worker.py
    autoDeploy: false
    envVars:
      - key: DHAN_CLIENT_ID
        sync: false
      - key: DHAN_ACCESS_TOKEN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
