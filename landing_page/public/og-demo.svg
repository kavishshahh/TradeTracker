<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">TradeBud — illustrative trading journal dashboard</title>
  <desc id="desc">A paper-toned dashboard preview labelled as illustrative demo data, with empty metric cards and a green line chart.</desc>
  <rect width="1200" height="630" fill="#f4f1e9"/>
  <rect x="0" y="0" width="1200" height="18" fill="#1f6b46"/>
  <text x="72" y="92" fill="#1b211d" font-family="Georgia, Times New Roman, serif" font-size="48" font-weight="600">TradeBud</text>
  <text x="74" y="126" fill="#1f6b46" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">ILLUSTRATIVE DASHBOARD PREVIEW</text>
  <text x="74" y="160" fill="#687069" font-family="Arial, sans-serif" font-size="16">Demo data · not a trading result · educational interface preview</text>
  <rect x="72" y="208" width="1056" height="300" rx="8" fill="#fbfaf6" stroke="#d5d0c4" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <text x="100" y="245" fill="#687069" font-size="12" font-weight="700" letter-spacing="2">PERFORMANCE OVERVIEW</text>
    <g fill="#f4f1e9" stroke="#d5d0c4">
      <rect x="100" y="270" width="220" height="84" rx="4"/>
      <rect x="340" y="270" width="220" height="84" rx="4"/>
      <rect x="580" y="270" width="220" height="84" rx="4"/>
      <rect x="820" y="270" width="220" height="84" rx="4"/>
    </g>
    <g fill="#687069" font-size="11">
      <text x="120" y="298">NET P&amp;L</text><text x="360" y="298">WIN RATE</text><text x="600" y="298">EXPECTANCY</text><text x="840" y="298">PROFIT FACTOR</text>
      <text x="120" y="331" fill="#9aa09a" font-size="18">—</text><text x="360" y="331" fill="#9aa09a" font-size="18">—</text><text x="600" y="331" fill="#9aa09a" font-size="18">—</text><text x="840" y="331" fill="#9aa09a" font-size="18">—</text>
    </g>
    <line x1="100" y1="411" x2="1040" y2="411" stroke="#d5d0c4"/>
    <path d="M120 472 L235 452 L350 465 L465 425 L580 440 L695 397 L810 416 L925 375 L1020 389" fill="none" stroke="#1f6b46" stroke-width="4"/>
    <circle cx="1020" cy="389" r="6" fill="#a67b32"/>
    <text x="100" y="443" fill="#687069" font-size="11" font-weight="700" letter-spacing="1.5">EQUITY CURVE · ILLUSTRATIVE ONLY</text>
  </g>
  <text x="74" y="574" fill="#687069" font-family="Arial, sans-serif" font-size="13">Record decisions. Review the process. Keep the numbers honest.</text>
</svg>
